name: Style or lesson idea
description: Suggest a music style or a lesson
labels: [style]
body:
  - type: input
    id: style
    attributes:
      label: Style
      placeholder: e.g. Cumbia
    validations:
      required: true
  - type: input
    id: artists
    attributes:
      label: Two or three artists or records
  - type: textarea
    id: sound
    attributes:
      label: What makes the sound
      description: The drums, chords, sounds or tricks that make it recognisable.
  - type: textarea
    id: first-win
    attributes:
      label: A first win on a bare Mac
      description: What could a beginner make in one short session with only this app and GarageBand's own sounds?
