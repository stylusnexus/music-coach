name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps one "release" pull request open with the next version and changelog.
  # Merging it tags the version and publishes the GitHub release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A personal access token lets the test check run on the release pull
          # request; without one, GitHub's own token is used and a maintainer
          # merges that pull request with admin bypass.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Builds the Mac app on a Mac and attaches it to the new release.
  app-zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: packaging/build.sh
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "dist/Music Coach.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
