name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps one "release" pull request open with the next version and changelog.
  # Merging it tags the version and creates the GitHub release as a draft, so the
  # "latest" download link doesn't move until the app zip is attached.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A personal access token lets the checks run on the release pull
          # request; without one, GitHub's own token is used and a maintainer
          # closes and reopens that pull request to start them.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # Builds the Mac app on a Mac, attaches it to the draft release, then publishes it.
  app-zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The Developer ID certificate goes into a keychain that exists only for this run.
      - name: Load the signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)
          if [ -z "$ID" ]; then echo "::error::MACOS_CERT_P12 holds no valid Developer ID Application certificate and key."; exit 1; fi
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      - run: packaging/build.sh
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      # Two names for the same zip: a stable one for the "latest" download link,
      # and one with the version, so a downloaded file says what it is.
      - run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "dist/Music Coach.zip" dist/Music-Coach-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
