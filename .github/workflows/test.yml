name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The oldest Python the app accepts (Apple's developer tools install 3.9),
      # and a current one. The last listed is the default python3.
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.9
            3.14
      - run: npm test
      - name: Server tests on Python 3.9
        run: python3.9 -m unittest discover -s tests
